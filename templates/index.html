<!DOCTYPE html>
<html>
<head>
    <title>Concept Clarity Interface</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<section class="hero">
    <h1 class="hero-title">
        Concept Clarity <span>Interface</span>
    </h1>
    <p class="hero-subtitle">
        Experience the future of interactive search
    </p>

    <div class="query-card">
        <label>Enter your query</label>
        <input type="text" id="queryInput" placeholder="Type a scientific term..." />
        <button onclick="sendQuery()">Explain →</button>
        <div class="result" id="resultBox"></div>
    </div>
</section>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
